[package]
name = "skill-reader"
version = "0.1.0"
edition = "2021"
description = "Rust CLI for reusable AI skill profiles"
license = "MIT"
repository = "https://github.com/dmontil/skill-reader"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
